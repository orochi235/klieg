name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Separately rather than through `npm run check`, so a failure names which one broke.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The published artifact is built by prepack, which nothing else here exercises.
      - name: Build the package
        run: npm run build -w klieg

      # Out of `npm test` on purpose: it reads `dist/`, which only exists after the step above.
      - name: Test the built standalone bundle
        run: npm run test:dist
