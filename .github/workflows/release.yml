name: Release

on:
  push:
    tags: ['v*']
  # Retrying a failed publish must not mean moving the tag: once a tag has shipped artifacts,
  # moving it to re-run a job is how the tag stops matching what was built.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.2.1'
        required: true

# No NPM_TOKEN: this publishes via npm trusted publishing (OIDC), so the
# credential is short-lived and minted per run. `id-token: write` is what
# makes that possible — without it npm falls back to looking for a token
# and fails. The npmjs.com side must name this exact filename.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >=11.5.1 to authenticate; below it the PUT goes up
      # unauthenticated and the registry answers 404 for a package that exists. .nvmrc carries
      # a Node new enough to bundle it — this only records which npm actually ran.
      - run: npm -v

      - run: npm ci

      # Reads the workspace package; the private root has no version field. TAG arrives through
      # env rather than inline `${{ }}`, which would splice the input into the script.
      - name: Tag must match package.json version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          pkg="v$(node -p "require('./packages/core/package.json').version")"
          if [ "$TAG" != "$pkg" ]; then
            echo "::error::tag $TAG does not match packages/core/package.json $pkg"
            exit 1
          fi

      # A tag for a version already on the registry is a record, not a republish: tagging a release
      # after the fact, or re-running a job whose publish already succeeded, both land here and
      # neither is a failure. Only this exact version is skipped, so a real publish still runs.
      - name: Skip if this version is already published
        id: published
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if npm view "klieg@$version" version >/dev/null 2>&1; then
            echo "klieg@$version is already on npm; nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.published.outputs.skip != 'true'
        run: npm run lint
      - if: steps.published.outputs.skip != 'true'
        run: npm run typecheck
      - if: steps.published.outputs.skip != 'true'
        run: npm test

      # prepublishOnly runs the checks again; these steps exist so a failure
      # names which one broke instead of surfacing as a failed publish.
      - name: Publish
        if: steps.published.outputs.skip != 'true'
        run: npm publish --workspace klieg --provenance --access public
