<!doctype html>
<meta charset="utf-8" />
<title>a hollowed letter</title>
<style>
  html, body { margin: 0; background: #0a0c11; }
  #stage { position: fixed; inset: 0; }
  #tag {
    position: fixed; left: 12px; top: 10px; pointer-events: none;
    font: 500 13px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; color: #8a93a6;
  }
</style>
<script type="importmap">
  { "imports": { "three": "/three/three.module.js" } }
</script>
<div id="stage"></div>
<div id="tag"></div>
<script type="module">
  import * as THREE from 'three';
  import { applyLook, createMaterial, specOf } from '/klieg/render/looks.js';
  import { Stage } from '/klieg/render/stage.js';

  const params = new URLSearchParams(location.search);
  const look = params.get('look') ?? 'gold';
  const data = await fetch('/geometry.json').then((r) => r.json());

  const stage = new Stage({ idleTimeoutMs: 3_600_000, target: document.getElementById('stage') });
  const renderer = stage.mount();

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(data.body.position, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(data.body.normal, 3));

  const metal = createMaterial(stage.environment?.texture ?? null);
  applyLook(metal, specOf(look));

  const letter = new THREE.Group();
  stage.scene.add(letter);
  const mesh = new THREE.Mesh(geo, metal);
  letter.add(mesh);

  // A stone per gem, not per pocket: one material each, and one mesh carrying every stone cut from
  // it. Transmission is what makes them read as stones rather than as coloured plastic, and it
  // costs a render target per material — so the whole point of grouping is that there are twenty of
  // those and not a hundred and twenty.
  const env = stage.environment?.texture ?? null;
  const gems = [];
  for (const { spec, position } of data.stones ?? []) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(position, 3));
    g.computeVertexNormals();
    const m = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(spec.color),
      metalness: 0,
      roughness: spec.roughness ?? 0.05,
      ior: spec.ior ?? 1.5,
      transmission: spec.transmission ?? 0,
      clearcoat: spec.clearcoat ?? 0,
      clearcoatRoughness: 0.04,
      iridescence: spec.iridescence ?? 0,
      iridescenceIOR: 1.8,
      envMap: env,
      envMapIntensity: 2.2,
      // A real stone is lit by light that enters its table and bounces off the pavilion facets from
      // the inside. Nothing here traces that, and the pocket behind the stone is opaque metal, so
      // the back faces are what stands in for it: without them the dark gems render as holes.
      side: THREE.DoubleSide,
    });
    if (spec.attenuation) m.attenuationColor = new THREE.Color(spec.attenuation);
    gems.push({ material: m, distance: spec.distance ?? 0 });
    letter.add(new THREE.Mesh(g, m));
  }

  const box = new THREE.Box3().setFromObject(letter);
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  const budget = stage.viewportBudget();
  letter.scale.setScalar(Math.min(budget.width / size.x, budget.height / size.y) * 1.9);
  letter.position.set(-centre.x * letter.scale.x, -centre.y * letter.scale.y, 0);
  // Off axis: head on, a recess and a flat face are the same silhouette and differ only in shade.
  letter.rotation.y = data.tilt;
  letter.rotation.x = data.tilt * 0.35;

  // Both are path lengths through the glass, so they are in world units and have to follow the
  // scale the letter was just fitted to the viewport with.
  const k = letter.scale.x;
  for (const { material, distance } of gems) {
    material.thickness = 0.02 * k;
    if (distance > 0) material.attenuationDistance = distance * 3 * k;
  }
  if ('transmissionResolutionScale' in renderer) renderer.transmissionResolutionScale = 0.5;

  const set = (data.stones ?? []).length;
  document.getElementById('tag').textContent =
    `${data.letter} · ${look} · hollowed${set > 0 ? ` · ${set} kinds of stone` : ''}`;

  let frames = 0;
  function frame() {
    renderer.render(stage.scene, stage.camera);
    if (++frames > 8) window.__shot = true;
    else requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
