<!doctype html>
<meta charset="utf-8" />
<title>inflation meshers</title>
<style>
  html, body { margin: 0; background: #0a0c11; }
  #stage { position: fixed; inset: 0; }
  #labels {
    position: fixed; inset: 0; display: grid; pointer-events: none;
    font: 500 13px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; color: #8a93a6;
  }
  #labels div { padding: 6px 10px; }
  #labels .col { align-self: start; justify-self: center; color: #cdd4e2; }
  #labels .row { align-self: center; justify-self: start; writing-mode: vertical-rl; rotate: 180deg; }
</style>
<script type="importmap">
  { "imports": { "three": "/three/three.module.js" } }
</script>
<div id="stage"></div>
<div id="labels"></div>
<script type="module">
  import * as THREE from 'three';
  import { BloomPath } from '/klieg/render/bloom.js';
  import { applyLook, createMaterial, specOf } from '/klieg/render/looks.js';
  import { Stage } from '/klieg/render/stage.js';

  const params = new URLSearchParams(location.search);
  const look = params.get('look') ?? 'gold';
  // Bloom is what the look ships with, and it is the wrong instrument for judging a mesh: it lays
  // a white wash over exactly the rim and the banding this page exists to show.
  const wantBloom = params.get('bloom') !== '0';
  const fill = Number(params.get('fill') ?? '1');
  const only = params.get('mesher');
  const data = await fetch('/geometry.json').then((r) => r.json());

  const stage = new Stage({ idleTimeoutMs: 3_600_000, target: document.getElementById('stage') });
  const renderer = stage.mount();
  const bloom = new BloomPath(renderer);

  const build = (dump) => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(dump.position, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(dump.normal, 3));
    if (dump.index) geo.setIndex(dump.index);
    return geo;
  };

  // The target, not its texture, is what `Stage` holds; `createMaterial` wants the map itself, and
  // a metal handed nothing renders black.
  const material = createMaterial(stage.environment?.texture ?? null);
  applyLook(material, specOf(look));
  const grid = new THREE.Group();
  stage.scene.add(grid);

  // The body is the extruder's, with its flat lid removed — so what differs between cells is only
  // the crown that replaced it, and nothing is hidden under an overlay.
  const body = build(data.body);
  const PITCH_X = 1.05;
  const PITCH_Y = 1.15;
  const cells = only ? data.cells.filter((c) => c.mesher === only) : data.cells;
  const cols = only ? [only] : data.cols;
  for (const cell of cells) {
    const col = cols.indexOf(cell.mesher);
    const row = data.rows.indexOf(cell.profile);
    const group = new THREE.Group();
    group.position.x = (col - (cols.length - 1) / 2) * PITCH_X;
    group.position.y = -(row - (data.rows.length - 1) / 2) * PITCH_Y;
    group.add(new THREE.Mesh(body, material));
    group.add(new THREE.Mesh(build(cell), material));
    grid.add(group);
  }

  const box = new THREE.Box3().setFromObject(grid);
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  const budget = stage.viewportBudget();
  grid.scale.setScalar(Math.min(budget.width / size.x, budget.height / size.y) * fill);
  grid.position.set(-centre.x * grid.scale.x, -centre.y * grid.scale.y, 0);

  const labels = document.getElementById('labels');
  labels.style.gridTemplateColumns = `repeat(${cols.length}, 1fr)`;
  labels.style.gridTemplateRows = `repeat(${data.rows.length}, 1fr)`;
  data.rows.forEach((profile, row) => {
    cols.forEach((mesher, col) => {
      const cell = data.cells.find((c) => c.profile === profile && c.mesher === mesher);
      const el = document.createElement('div');
      el.className = row === 0 ? 'col' : 'cell';
      el.textContent =
        (row === 0 ? `${mesher} · ` : '') +
        `${cell.vertices.toLocaleString()} verts · rim ${cell.rim.toFixed(4)}`;
      el.style.gridArea = `${row + 1} / ${col + 1}`;
      labels.append(el);
      if (col === 0) {
        const tag = document.createElement('div');
        tag.className = 'row';
        tag.textContent = profile;
        tag.style.gridArea = `${row + 1} / 1`;
        labels.append(tag);
      }
    });
  });

  let frames = 0;
  function frame() {
    if (wantBloom) bloom.render(stage.scene, stage.camera);
    else renderer.render(stage.scene, stage.camera);
    if (++frames > 6) window.__shot = true;
    else requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
