<!doctype html>
<meta charset="utf-8" />
<title>pavé</title>
<style>
  html, body { margin: 0; background: #0a0c11; }
  #stage { position: fixed; inset: 0; }
  #tag {
    position: fixed; left: 12px; top: 10px; pointer-events: none;
    font: 500 13px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; color: #8a93a6;
  }
</style>
<script type="importmap">
  { "imports": { "three": "/three/three.module.js" } }
</script>
<div id="stage"></div>
<div id="tag"></div>
<script type="module">
  import * as THREE from 'three';
  import { applyLook, createMaterial, specOf } from '/klieg/render/looks.js';
  import { Stage } from '/klieg/render/stage.js';

  const params = new URLSearchParams(location.search);
  const look = params.get('look') ?? 'gold';
  const tint = Number(params.get('tint') ?? '0.5');
  const data = await fetch('/geometry.json').then((r) => r.json());

  const stage = new Stage({ idleTimeoutMs: 3_600_000, target: document.getElementById('stage') });
  const renderer = stage.mount();

  const build = (dump) => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(dump.position, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(dump.normal, 3));
    if (dump.index) geo.setIndex(dump.index);
    return geo;
  };

  const metal = createMaterial(stage.environment?.texture ?? null);
  applyLook(metal, specOf(look));
  const gem = createMaterial(stage.environment?.texture ?? null);
  applyLook(gem, specOf('gem'));
  // Thickness is in world units and `gem`'s is tuned for a letter-sized volume; a stone is a
  // fraction of that, so it has to be scaled or the field renders as holes.
  gem.thickness = tint * 0.05;

  const letter = new THREE.Group();
  stage.scene.add(letter);
  const parts = params.get('parts') ?? 'both';
  if (parts !== 'stones') letter.add(new THREE.Mesh(build(data.body), metal));
  if (parts !== 'body') letter.add(new THREE.Mesh(build(data.stones), parts === 'stones' ? metal : gem));

  const box = new THREE.Box3().setFromObject(letter);
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  const budget = stage.viewportBudget();
  letter.scale.setScalar(Math.min(budget.width / size.x, budget.height / size.y) * 2.2);
  letter.position.set(-centre.x * letter.scale.x, -centre.y * letter.scale.y, 0);

  document.getElementById('tag').textContent =
    `${data.letter} · ${look} · ${data.cells} cells · tint ${tint}`;

  let frames = 0;
  function frame() {
    renderer.render(stage.scene, stage.camera);
    if (++frames > 8) window.__shot = true;
    else requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
