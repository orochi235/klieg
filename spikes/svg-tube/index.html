<!doctype html>
<meta charset="utf-8">
<title>klieg — tubing on vector art</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #hud {
    position: fixed; left: 12px; top: 12px; z-index: 2;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #9aa4b2; background: #11141ce6; padding: 10px 12px; border-radius: 8px;
    width: 300px; max-height: calc(100vh - 24px); overflow-y: auto;
  }
  #hud b { color: #e6ebf2; font-weight: 600; }
  #title { cursor: pointer; user-select: none; }
  #title .hint { color: #6b7684; }
  #hud.collapsed #controls, #hud.collapsed .row, #hud.collapsed label { display: none; }
  #hud.collapsed { width: auto; }
  #hud label { display: grid; grid-template-columns: 84px 1fr 38px; align-items: center;
                gap: 6px; margin-top: 3px; }
  #hud label.check { grid-template-columns: auto 1fr; }
  #hud .group { margin-top: 10px; color: #6b7684; text-transform: uppercase;
                letter-spacing: .08em; font-size: 10px; }
  #hud output { text-align: right; color: #cfd6e0; }
  #hud input[type=range] { width: 100%; }
  #hud select { width: 100%; }
  #hud .row { margin-top: 8px; }
  #silhouette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; display: none;
    align-items: center; justify-content: center;
  }
  #silhouette.on { display: flex; }
  #silhouette img { width: 70vw; opacity: 0.45; filter: invert(1); }
  #err { position: fixed; left: 12px; bottom: 12px; z-index: 3; color: #ff8a8a;
         font: 12px ui-monospace, monospace; white-space: pre-wrap; }
</style>
<div id="stage"></div>
<div id="silhouette"><img id="ref" alt=""></div>
<div id="hud">
  <div id="title"><b>tubing on vector art</b> <span class="hint">[hide]</span></div>
  <div id="stats">loading…</div>
  <div class="row">drag to pivot · double-click to reset</div>
  <label class="check"><input type="checkbox" id="showRef"> overlay source SVG</label>
  <div id="controls"></div>
</div>
<div id="err"></div>
<script type="module" src="./main.js"></script>
