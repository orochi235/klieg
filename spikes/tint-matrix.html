<!doctype html>
<meta charset="utf-8" />
<title>tint matrix</title>
<style>
  body { margin: 0; background: #08090b; }
  /* The anchor is the whole subject: a wide short strip, the shape a masthead asks for. */
  #strip { position: relative; width: 100%; height: 140px; }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "/three/three.module.js",
      "klieg": "/klieg/index.js",
      "opentype.js": "/opentype/opentype.mjs"
    }
  }
</script>
<div id="strip"></div>
<script type="module">
  import { createKlieg } from 'klieg';

  const q = new URLSearchParams(location.search);
  const tint = q.get('tint');

  window.__shot = false;
  const klieg = createKlieg({
    fontUrl: '/font.ttf',
    placement: { kind: 'element', el: document.getElementById('strip') },
    framing: { width: 0.9, height: 0.55 },
  });

  void klieg.fire(q.get('text') ?? 'Michael Baker', {
    look: q.get('look') ?? 'gold',
    // static, so a frame is the same frame every run — sweep would sample mid-rake.
    lighting: 'static',
    enter: 'none',
    hold: 600_000,
    ...(tint ? { tint: Number.parseInt(tint, 16) } : {}),
  });

  // The word build blocks the main thread, so this settles only once there is something to shoot.
  setTimeout(() => { window.__shot = true; }, 2500);
</script>
